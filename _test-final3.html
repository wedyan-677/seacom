<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}iframe{display:block;width:1440px;height:900px;border:0}</style></head>
<body>
<iframe id="app" src="http://localhost:4173/#slide-8" title="final slide"></iframe>
<script>
  const frame = document.getElementById('app');
  frame.addEventListener('load', () => {
    setTimeout(() => {
      const doc = frame.contentDocument;
      const style = doc.createElement('style');
      style.textContent = '.slide{transition:none!important}.slide.is-active{opacity:1!important;visibility:visible!important}.slide .slide-media{animation:none!important}.slide-title--final em{outline:2px solid yellow!important}.slide-title--final{outline:2px solid lime!important}';
      doc.head.appendChild(style);
    }, 900);
  });
</script>
</body>
</html>
