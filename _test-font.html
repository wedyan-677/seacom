<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Aref Ruqaa"; src: url("assets/fonts/aref-ruqaa-700-arabic.woff2") format("woff2"); font-weight: 700; font-display: block; }
  body { margin: 0; background: #041018; color: #fff; font-family: "Aref Ruqaa", serif; }
  .wrap { padding: 40px; }
  .line { font-size: 100px; font-weight: 700; line-height: 1.1; margin: 0 0 40px; }
  .grad { display: block; padding: 0.2em 0.05em 0.05em; background: linear-gradient(180deg, #f4fffd 0%, #a4fff0 48%, #3ad6c1 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .plain { display: block; padding: 0.2em 0.05em 0.05em; color: #67ebda; }
  .outline { outline: 1px dashed #ff5; }
</style>
</head>
<body>
<div class="wrap">
  <div class="line">رحلتنا إلى الأعماق</div>
  <div class="line grad outline">تبدأ الآن!</div>
  <div class="line plain outline">تبدأ الآن!</div>
</div>
</body>
</html>
